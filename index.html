<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=search" />
  <link rel="stylesheet" href="/src/style.css">
</head>

<body>
  <div class="main-container">
    <div class="main-weather">
      <div class="weather-search">
        <input type="text" placeholder="Enter Your City">
        <button class="searchbtn"><span class="material-symbols-outlined">search</span></button>
      </div>
      <div class="weather">
        <img src="/public/images/rain.png" alt="" class="weather-icon">
        <h1 class="temprature">22°c</h1>
        <h2 class="city">New York</h2>
      </div>
      <div class="detail">
        <div class="colone">
          <img src="/public/images/humidity.png" alt="">
          <div>
            <p class="humidity">50</p>
            <p>humidity</p>
          </div>
        </div>
        <div class="colone">
          <img src="/public/images/wind.png" alt="">
          <div>
            <p class="Wind">15</p>
            <p>Wind Speed</p>
          </div>
        </div>
      </div>
    </div>
  </div>
  
   
  <script src="/src/fetch.js"></script>
 
</body>

</html>
